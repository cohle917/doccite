[project]
name = "doccite"
version = "0.1.0"
description = "Local document retrieval and citation verification over MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "mcp[cli]>=1.20,<2",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "trafilatura>=2.3.1",
]

[project.scripts]
doccite = "doccite.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "reportlab>=5.1.0",
    "ruff>=0.17.4",
]
