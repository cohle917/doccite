name: CI

on: [push, pull_request]

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
